name: Import manual allocation branch checks

on:
  push:
    branches:
      - feature/import-manual-cost-allocation

permissions:
  contents: read

jobs:
  import-and-accounting-tests:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Run import domain tests
        run: node tests/import-domain.test.js
      - name: Run all accounting and feature tests
        run: |
          set -e
          for test_file in tests/*.test.js; do
            echo "::group::${test_file}"
            node "${test_file}"
            echo "::endgroup::"
          done
