name: Import receipt audit history

on:
  pull_request:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

jobs:
  import-receipt-audit:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Run all regression tests
        run: |
          set -e
          for test_file in tests/*.test.js; do
            echo "::group::${test_file}"
            node "${test_file}"
            echo "::endgroup::"
          done
