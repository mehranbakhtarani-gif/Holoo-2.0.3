name: Import receipt audit history

on:
  pull_request:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

jobs:
  import-receipt-audit:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Run import receipt regression tests
        run: |
          set -e
          node tests/import-receipt-audit.test.js
          node tests/import-receipt-snapshot.test.js
          node tests/import-receipt-dependency-preflight.test.js
          node tests/import-dashboard.test.js
