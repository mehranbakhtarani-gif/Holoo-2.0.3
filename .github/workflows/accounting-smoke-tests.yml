name: Manual accounting and feature tests

on:
  workflow_dispatch:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main

permissions:
  contents: read

jobs:
  accounting-and-features:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Run every test suite
        run: |
          set -e
          node tests/manual-voucher-correction-atomicity.test.js
          node tests/invoice-posting-atomicity.test.js
          node tests/invoice-integrity-audit.test.js
          node tests/inventory-value-discrepancy-sources.test.js
          node tests/settlement-ledger-line-integrity.test.js
          node tests/settlement-allocation-legacy-fallback.test.js
          node tests/settlement-duplicate-allocation-rows.test.js
          node tests/bank-transfer-audit-integrity.test.js
          node tests/party-control-reconciliation.test.js
          node tests/fx-operations-atomicity.test.js
          node tests/closed-period-correction-lock.test.js
          node tests/cheque-maturity-atomicity.test.js
          node tests/treasury-check-atomicity.test.js
          node tests/cheque-outcome-voucher-integrity.test.js
          node tests/returned-cheque-allocation-reconciliation.test.js
          node tests/credit-refund-reconciliation.test.js
          node tests/party-control-identity-mapping.test.js
          for test_file in tests/bank*.test.js tests/account-ledger.test.js tests/accounting-reports-cross-validation.test.js tests/accounting-smoke.test.js tests/fiscal-year-close.test.js; do
            echo "::group::${test_file}"
            node "${test_file}"
            echo "::endgroup::"
          done
