name: Manual accounting and feature tests

on:
  push:
    branches:
      - main
  workflow_dispatch:
  pull_request:
    branches:
      - feature/party-ledger-detail

permissions:
  contents: read

jobs:
  accounting-and-features:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Run every test suite
        run: |
          set -e
          for test_file in \
            tests/dashboard-accounting-kpis.test.js \
            tests/dashboard-mobile-accessibility.test.js \
            tests/dashboard-priorities.test.js \
            tests/accounting-reports-cross-validation.test.js \
            tests/accounting-smoke.test.js \
            tests/profit-loss-report.test.js; do
            echo "::group::${test_file}"
            node "${test_file}"
            echo "::endgroup::"
          done
