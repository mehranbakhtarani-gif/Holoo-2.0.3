name: Accounting smoke tests

on:
  push:
    branches: [main]
    paths:
      - 'index.html'
      - 'tests/accounting-smoke.test.js'\n      - 'tests/extended-workflow.test.js'
      - '.github/workflows/accounting-smoke-tests.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  accounting-smoke:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Run accounting smoke tests
        run: |\n          node tests/accounting-smoke.test.js\n          node tests/extended-workflow.test.js
