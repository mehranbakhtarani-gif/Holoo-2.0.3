name: Holoo CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  accounting-and-integrity:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Run accounting and integrity test suite
        run: |
          node tests/fifo-batch.test.js
          node tests/invoice-warehouse-binding.test.js
          node tests/stocktaking-atomicity.test.js
          node tests/warehouse-stagnant-days.test.js
          node tests/warehouse-batch-metadata.test.js
          node tests/multi-warehouse-reconciliation.test.js
          node tests/warehouse-assignment.test.js
          node tests/aging-report.test.js
          node tests/profit-loss-report.test.js
          node tests/dashboard-accounting-kpis.test.js
          node tests/dashboard-mobile-accessibility.test.js
          node tests/dashboard-priorities.test.js
          node tests/balance-sheet-report.test.js
          node tests/actual-cash-flow.test.js
          node tests/accounting-reports-cross-validation.test.js
          node tests/trial-balance-print.test.js
          node tests/import-dashboard.test.js
          node tests/import-domain.test.js
          node tests/fx-commitment.test.js
          node tests/fx-revaluation.test.js
          node tests/operation-dates.test.js
          node tests/android-pwa.test.js
          node tests/object-motion.test.js
          node tests/operation-journal-failure.test.js
          node tests/jalali-date-input.test.js
          node tests/device-actor-assignment.test.js
          node tests/product-editing.test.js
          node tests/party-editing.test.js
          node tests/barcode-labels.test.js
          node tests/accounting-smoke.test.js
          node tests/treasury-allocation.test.js
          node tests/account-ledger.test.js
          node tests/extended-workflow.test.js
          node tests/advanced-accounting-lifecycle.test.js
          node tests/reporting-and-sync.test.js
          node tests/payroll-fixed-assets.test.js
          node tests/treasury-commitments.test.js
          node tests/operational-exports.test.js
          node tests/multi-device-rpc-contract.test.js
          node tests/multi-device-concurrency.test.js
          node tests/editability-controls.test.js
          node tests/invoice-correction.test.js
          node tests/treasury-check-correction.test.js
          node tests/voucher-correction-review.test.js
          node tests/invoice-return-correction-review.test.js
          node tests/warehouse-movement-correction-review.test.js
          node tests/import-receipt-correction-review.test.js
          node tests/import-receipt-dependency-preflight.test.js
          node tests/import-receipt-snapshot.test.js
          node tests/full-fiscal-period.integration.test.js
          node tests/google-drive-manual-backup.test.js
